[project]
name = "proyeccion-linea-teleferico"
version = "0.1.0"
description = "Accesibilidad peatonal con pendiente a Mi Teleférico (La Paz - El Alto) y propuesta optimizada de una nueva línea."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "geopandas>=1.2.0",
    "gtfs-kit>=13.0.1",
    "h3>=4.5.0",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pulp>=3,<4",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "spopt>=0.7.0",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleferico"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]
